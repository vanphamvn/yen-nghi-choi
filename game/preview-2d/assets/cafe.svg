 <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4b3929" flood-opacity=".25"/></filter>
</defs>
<!-- Afternoon walls and floor -->
