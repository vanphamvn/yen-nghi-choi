<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#ebdfc7"/><stop offset=".75" stop-color="#faf0d9"/><stop offset="1" stop-color="#dfc8a9"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b27a51"/><stop offset=".45" stop-color="#976847"/><stop offset="1" stop-color="#76583e"/></linearGradient>
 <linearGradient id="floor" x1="0" x2=".3" y2="1"><stop stop-color="#e9c6a3"/><stop offset="1" stop-color="#b87f62"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#c6e5d5"/><stop offset=".8" stop-color="#f8e4b5"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff6d5" stop-opacity=".8"/><stop offset="1" stop-color="#fff8db" stop-opacity="0"/></radialGradient>
 <radialGradient id="shade"><stop stop-color="#3a4f37" stop-opacity=".14"/><stop offset="1" stop-color="#3a4f37" stop-opacity="0"/></radialGradient>
