<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1ea">
<meta name="description" content="Tìm bốn điểm khác nhau giữa hai hình trong Góc chơi của Yên.">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&display=swap">
<link rel="stylesheet" href="/choi/choi.css">
<title>Tìm điểm khác nhau | Yên Coffee &amp; Tea</title>
<style>
.page > *{max-width:920px}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.board{position:relative;overflow:hidden;align-self:start;aspect-ratio:4/3;border:5px solid var(--paper);background:#e9dfd0;box-shadow:0 4px 12px #171a1c24}
.board img{display:block;width:100%;height:100%;object-fit:cover;object-position:center var(--crop,60%);pointer-events:none}
.prop{position:absolute;left:var(--x);top:var(--y);width:var(--size);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(2px 3px 1px #17231f70);pointer-events:none}
.prop::before,.prop::after{content:'';position:absolute;inset:0}
.planter::before{background:#47613e;clip-path:polygon(48% 68%,14% 49%,5% 24%,35% 36%,45% 53%,43% 12%,59% 1%,65% 25%,57% 53%,78% 29%,98% 24%,85% 49%,57% 68%)}
.planter::after{background:linear-gradient(100deg,var(--paper-light) 60%,var(--paper-dark) 61%);clip-path:polygon(20% 62%,80% 62%,70% 96%,29% 96%)}
.umbrella::before{background:linear-gradient(115deg,var(--paper-light) 52%,var(--paper-dark) 53%);clip-path:polygon(0 49%,20% 18%,52% 7%,82% 18%,100% 49%,76% 43%,52% 49%,24% 43%)}
.umbrella::after{background:#74583e;clip-path:polygon(48% 45%,54% 45%,55% 88%,69% 94%,32% 94%,48% 88%)}
.stool::before{background:var(--paper-dark);clip-path:polygon(19% 31%,77% 31%,86% 98%,71% 98%,60% 56%,38% 56%,27% 98%,13% 98%)}
.stool::after{background:var(--paper-light);clip-path:polygon(0 27%,26% 14%,91% 15%,99% 33%,79% 47%,13% 46%)}
.crate::before{background:linear-gradient(90deg,var(--paper-light) 63%,var(--paper-dark) 64%);clip-path:polygon(6% 38%,66% 38%,96% 22%,91% 74%,65% 93%,14% 87%)}
.crate::after{background:var(--paper-light);clip-path:polygon(6% 38%,33% 20%,96% 22%,66% 44%)}
.bird::before{background:var(--paper-light);clip-path:polygon(0 51%,24% 49%,45% 27%,53% 1%,65% 34%,74% 40%,84% 30%,93% 32%,100% 44%,88% 46%,78% 62%,54% 73%,23% 69%)}
.lantern::before{background:var(--paper-dark);clip-path:polygon(46% 0,54% 0,54% 21%,76% 24%,89% 46%,79% 72%,58% 79%,56% 98%,45% 98%,44% 79%,20% 72%,11% 46%,24% 24%,46% 21%)}
.lantern::after{inset:29% 34% 26%;border-inline:1px solid var(--paper-light);border-radius:50%}
.sign::before{background:#78553c;clip-path:polygon(45% 44%,53% 44%,53% 86%,68% 94%,32% 94%,45% 86%)}
.sign::after{background:var(--paper-light);clip-path:polygon(6% 19%,75% 19%,98% 38%,75% 56%,6% 56%)}
.kite::before{background:linear-gradient(90deg,var(--paper-light) 49%,var(--paper-dark) 50%);clip-path:polygon(52% 4%,88% 35%,53% 68%,19% 35%)}
.kite::after{background:#e9ddba;clip-path:polygon(53% 63%,58% 63%,46% 81%,50% 98%,45% 98%,40% 80%)}
.bunting::before{background:linear-gradient(12deg,var(--paper-light) 42%,var(--paper-dark) 43%);clip-path:polygon(0 23%,33% 34%,70% 34%,100% 23%,88% 65%,69% 39%,51% 77%,34% 39%,12% 65%)}
.tile{position:absolute;top:var(--y);left:var(--x);width:clamp(44px,15%,68px);z-index:1;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;background:none;cursor:pointer;touch-action:manipulation}
.tile.is-found{border:2px solid #fbfaf5;box-shadow:0 0 0 2px #6a2028}
.tile:focus-visible{z-index:1;outline-offset:-3px}
.round-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.round-bar p{margin:0}
.round-bar .go{min-height:44px;font-size:15px}
@media(max-width:660px){
  .boards{grid-template-columns:1fr;gap:8px;width:min(100%,440px)}
}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <a class="home" href="/" aria-label="Yên Coffee &amp; Tea, về trang chủ"><span class="logo"></span></a>
    <a class="back" href="/choi/">← Góc chơi</a>
  </header>
  <div>
    <h1>Tìm điểm khác nhau</h1>
    <p class="lede">Chạm vào 4 chỗ khác nhau trên một trong hai hình.</p>
  </div>
  <div class="round-bar">
    <span class="play-clock" id="clock" aria-label="Thời gian" aria-live="off">0.000 s</span>
    <p id="progress" aria-live="polite">0 / 4</p>
    <button type="button" class="go" id="next">Đổi bộ hình</button>
  </div>
  <div class="boards" id="boards">
    <div class="board" role="group" aria-label="Hình 1"></div>
    <div class="board" role="group" aria-label="Hình 2"></div>
  </div>
  <p class="say" id="say" role="status"></p>
</main>
<script src="/choi/clock.js"></script>
<script>
(() => {
  'use strict';
  const shapes = {
    sky: ['bird', 'kite'],
    wall: ['lantern', 'bunting'],
    ground: ['planter', 'umbrella', 'stool', 'crate', 'sign']
  };
  const palettes = [
    ['#f1cf86', '#b47b38'], ['#e9a1a1', '#ab5551'], ['#8fc9df', '#487e9c'],
    ['#abc88a', '#5f855b'], ['#e5d9ba', '#9d855d'], ['#c9b0e2', '#8264a3']
  ];

  const decks = [
    {
      src: '/meo-ngu/quan.jpg', crop: '43%', name: 'Mặt tiền mô hình giấy Yên',
      spots: [[76,17,7,'sky'],[58,54,6,'wall'],[82,77,8,'ground'],[28,82,7,'ground'],[48,72,7,'ground'],[17,44,6,'wall'],[89,43,6,'wall']]
    },
    {
      src: '/quet-la/san.jpg', crop: '44%', name: 'Sân mô hình giấy Yên',
      spots: [[48,18,7,'ground'],[47,71,7,'ground'],[77,83,8,'ground'],[29,48,6,'ground'],[63,36,6,'ground'],[24,79,7,'ground'],[79,57,6,'wall']]
    },
    {
      src: '/ve-mai/mai.jpg', crop: '61%', name: 'Mái mô hình giấy Yên',
      spots: [[77,15,7,'sky'],[63,45,6,'ground'],[66,82,8,'ground'],[26,74,7,'ground'],[41,41,6,'ground'],[83,59,6,'ground'],[17,23,6,'sky']]
    }
  ];
  const total = 4;
  const boards = document.querySelector('#boards');
  const progress = document.querySelector('#progress');
  const say = document.querySelector('#say');
  const next = document.querySelector('#next');
  const clock = createPlayClock(document.querySelector('#clock'));
  let previous = -1;
  let bag = [];
  let found;

  function draw(spot, index) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.dataset.index = index;
    tile.style.setProperty('--x', spot[0] + '%');
    tile.style.setProperty('--y', spot[1] + '%');
    tile.setAttribute('aria-label', `Vị trí ${index + 1}`);
    return tile;
  }

  const pickRandom = items => items[Math.floor(Math.random() * items.length)];

  function createRoundProps(spots) {
    const remaining = spots.map((_, index) => index);
    const changes = new Map();
    for (const kind of ['shape', 'shift', 'shift', 'size']) {
      const [index] = remaining.splice(Math.floor(Math.random() * remaining.length), 1);
      changes.set(index, kind);
    }
    return spots.map(([x, y, size, category], index) => {
      const options = shapes[category];
      const original = { x, y, size, shape: pickRandom(options), palette: pickRandom(palettes) };
      const altered = { ...original };
      const change = changes.get(index);
      if (change === 'shape') {
        altered.shape = pickRandom(options.filter(shape => shape !== original.shape));
        altered.palette = pickRandom(palettes.filter(palette => palette !== original.palette));
      } else if (change === 'shift') {
        altered.x += Math.random() < .5 ? -4.5 : 4.5;
      } else if (change === 'size') {
        altered.size *= .72;
      }
      const pair = Math.random() < .5 ? [original, altered] : [altered, original];
      return { pair, differs: changes.has(index) };
    });
  }

  function drawProp({ x, y, size, shape, palette: [light, dark] }) {
    const prop = document.createElement('span');
    prop.className = 'prop ' + shape;
    prop.style.setProperty('--x', x + '%');
    prop.style.setProperty('--y', y + '%');
    prop.style.setProperty('--size', size + '%');
    prop.style.setProperty('--paper-light', light);
    prop.style.setProperty('--paper-dark', dark);
    prop.setAttribute('aria-hidden', 'true');
    return prop;
  }

  async function startRound() {
    next.disabled = true;
    clock.reset();
    found = new Set();
    progress.textContent = `0 / ${total}`;
    say.textContent = 'Đang mở ảnh…';
    for (const board of boards.children) board.replaceChildren();
    if (!bag.length) bag = decks.map((_, index) => index);
    const candidates = bag.filter(index => index !== previous);
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    bag.splice(bag.indexOf(pick), 1);
    previous = pick;
    const deck = decks[pick];
    const props = createRoundProps(deck.spots);
    const targets = deck.spots.flatMap((spot, index) => props[index].differs ? [draw(spot, index)] : []);
    const image = new Image(900, 1200);
    image.alt = deck.name;
    image.src = deck.src;
    try {
      await image.decode();
      Array.from(boards.children).forEach((board, index) => {
        board.style.setProperty('--crop', deck.crop);
        board.replaceChildren(image.cloneNode(), ...props.map(({ pair }) => drawProp(pair[index])), ...targets.map(tile => tile.cloneNode()));
      });
      next.textContent = 'Đổi bộ hình';
      say.textContent = deck.name;
      clock.start();
    } catch {
      say.textContent = 'Ảnh chưa mở được. Bấm “Đổi bộ hình” để thử lại.';
      next.textContent = 'Đổi bộ hình';
    } finally {
      next.disabled = false;
    }
  }

  boards.addEventListener('click', (event) => {
    const tile = event.target.closest('.tile');
    if (next.disabled || found.size === total) return;
    if (!tile) {
      say.textContent = 'Chỗ này giống nhau.';
      return;
    }
    const index = Number(tile.dataset.index);
    if (found.has(index)) return;
    found.add(index);
    boards.querySelectorAll(`[data-index="${index}"]`).forEach(match => {
      match.classList.add('is-found');
      match.setAttribute('aria-disabled', 'true');
    });
    progress.textContent = `${found.size} / ${total}`;
    say.textContent = 'Đúng rồi!';
    if (found.size === total) {
      clock.stop();
      say.textContent = 'Tìm đủ rồi! Thời gian của bạn là ' + document.querySelector('#clock').textContent;
      next.textContent = 'Chơi bộ khác';
      next.focus({ preventScroll: true });
    }
  });

  next.addEventListener('click', startRound);
  startRound();
})();
</script>
</body>
</html>
