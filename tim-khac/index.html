<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1ea">
<meta name="description" content="Tìm bốn điểm khác nhau giữa hai hình trong Góc chơi của Yên.">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&display=swap">
<link rel="stylesheet" href="/choi/choi.css">
<title>Tìm điểm khác nhau | Yên Coffee &amp; Tea</title>
<style>
.page > *{max-width:920px}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--scene-color);padding:5px;border:5px solid var(--paper);box-shadow:0 4px 12px #171a1c24}
.tile{position:relative;min-width:0;min-height:44px;aspect-ratio:1.16;border:0;border-radius:8px;background:none;padding:0;font-size:clamp(22px,4.2vw,44px);cursor:pointer;touch-action:manipulation}
.tile:nth-child(n+6):nth-child(-n+10){background:#ffffff28}
.tile.is-found::after{position:absolute;inset:3px;content:'';border:2px solid #6a2028;border-radius:50%;box-shadow:0 0 0 2px #fbfaf5;pointer-events:none}
.tile:focus-visible{z-index:1;outline-offset:-3px}
.round-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.round-bar p{margin:0}
.round-bar .go{min-height:44px;font-size:15px}
@media(max-width:660px){
  .boards{grid-template-columns:1fr;gap:8px;width:min(100%,440px)}
  .tile{font-size:clamp(22px,7.2vw,35px);aspect-ratio:1.48}
}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <a class="home" href="/" aria-label="Yên Coffee &amp; Tea, về trang chủ"><span class="logo"></span></a>
    <a class="back" href="/choi/">← Góc chơi</a>
  </header>
  <div>
    <h1>Tìm điểm khác nhau</h1>
    <p class="lede">Chạm vào 4 chỗ khác nhau trên một trong hai hình.</p>
  </div>
  <div class="round-bar">
    <span class="play-clock" id="clock" aria-label="Thời gian" aria-live="off">0.000 s</span>
    <p id="progress" aria-live="polite">0 / 4</p>
    <button type="button" class="go" id="next">Đổi bộ hình</button>
  </div>
  <div class="boards" id="boards">
    <div class="board" role="group" aria-label="Hình 1"></div>
    <div class="board" role="group" aria-label="Hình 2"></div>
  </div>
  <p class="say" id="say" role="status"></p>
</main>
<script src="/choi/clock.js"></script>
<script>
(() => {
  'use strict';
  const decks = [
    { name: 'Bàn cà phê', color: '#e9d9bd', items: '🪴 🫖 🍪 🥄 🕯️ ☕ 🍰 🍋 🥛 🍯 📖 🥐 🍫 🧁 🌿', changes: [[0,'🌵'],[2,'🍩'],[4,''],[5,'🍵'],[7,'🍊'],[11,'🥨'],[13,'🍮']] },
    { name: 'Sân vườn', color: '#d8e4c2', items: '🌳 🐦 🌼 🦋 🌳 🍄 🐌 🌷 🐝 🌱 🪨 🌿 🐈 🍂 🪴', changes: [[1,'🦜'],[2,'🌻'],[5,''],[7,'🌸'],[8,'🐞'],[12,'🐕'],[14,'🌵']] },
    { name: 'Kệ sách', color: '#e6d5cf', items: '📚 🕰️ 🪴 🖼️ 📕 🧸 📗 🎨 📘 🕯️ 🔎 🖋️ 📙 🎁 ☕', changes: [[1,'⏳'],[3,''],[5,'🪆'],[6,'📓'],[7,'✂️'],[11,'✏️'],[14,'🍵']] },
    { name: 'Quầy trái cây', color: '#f0deae', items: '🍉 🍍 🍊 🍎 🍐 🍌 🍇 🥭 🍓 🥥 🍋 🥝 🍒 🍑 🫐', changes: [[0,'🍈'],[2,'🍋'],[3,'🍏'],[5,''],[8,'🍒'],[9,'🥑'],[13,'🍅']] },
    { name: 'Bãi biển', color: '#cee5e7', items: '☀️ ☁️ 🐦 ⛵ 🌤️ 🐬 🌊 🏝️ 🐟 🛟 🦀 🐚 🏖️ 🩴 🪸', changes: [[1,''],[2,'🪁'],[3,'🚤'],[5,'🐳'],[8,'🐠'],[10,'🦞'],[13,'🕶️']] },
    { name: 'Buổi cắm trại', color: '#dfdbbd', items: '🌲 ⭐ 🌙 ☁️ 🌲 🏕️ 🐿️ 🦉 🪵 🔦 🥾 🔥 🍵 🎒 🪨', changes: [[1,''],[2,'🌕'],[5,'⛺'],[6,'🦔'],[7,'🦇'],[12,'☕'],[14,'🍄']] }
  ];
  const total = 4;
  const boards = document.querySelector('#boards');
  const progress = document.querySelector('#progress');
  const say = document.querySelector('#say');
  const next = document.querySelector('#next');
  const clock = createPlayClock(document.querySelector('#clock'));
  let previous = -1;
  let bag = [];
  let differences;
  let found;

  function draw(items) {
    return items.map((item, index) => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile';
      tile.dataset.index = index;
      tile.textContent = item;
      tile.setAttribute('aria-label', `Hàng ${Math.floor(index / 5) + 1}, cột ${index % 5 + 1}`);
      return tile;
    });
  }

  function startRound() {
    if (!bag.length) bag = decks.map((_, index) => index);
    const candidates = bag.filter(index => index !== previous);
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    bag.splice(bag.indexOf(pick), 1);
    previous = pick;
    const deck = decks[pick];
    const original = deck.items.split(' ');
    const altered = [...original];
    const changes = [...deck.changes];
    differences = new Set();
    found = new Set();
    for (let i = 0; i < total; i++) {
      const [index, replacement] = changes.splice(Math.floor(Math.random() * changes.length), 1)[0];
      altered[index] = replacement;
      differences.add(index);
    }
    const [first, second] = Math.random() < .5 ? [original, altered] : [altered, original];
    boards.style.setProperty('--scene-color', deck.color);
    boards.children[0].replaceChildren(...draw(first));
    boards.children[1].replaceChildren(...draw(second));
    next.textContent = 'Đổi bộ hình';
    progress.textContent = `0 / ${total}`;
    say.textContent = deck.name;
    clock.start();
  }

  boards.addEventListener('click', (event) => {
    const tile = event.target.closest('.tile');
    if (!tile || found.size === total) return;
    const index = Number(tile.dataset.index);
    if (found.has(index)) return;
    if (!differences.has(index)) {
      say.textContent = 'Chỗ này giống nhau.';
      return;
    }
    found.add(index);
    boards.querySelectorAll(`[data-index="${index}"]`).forEach(match => {
      match.classList.add('is-found');
      match.setAttribute('aria-disabled', 'true');
    });
    progress.textContent = `${found.size} / ${total}`;
    say.textContent = 'Đúng rồi!';
    if (found.size === total) {
      clock.stop();
      say.textContent = 'Tìm đủ rồi! Thời gian của bạn là ' + document.querySelector('#clock').textContent;
      next.textContent = 'Chơi bộ khác';
      next.focus({ preventScroll: true });
    }
  });

  next.addEventListener('click', startRound);
  startRound();
})();
</script>
</body>
</html>
