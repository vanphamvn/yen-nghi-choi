# Yên Coffee & Tea — Netlify hosting for the same GitHub source.
# Static website: index.html and /assets, no framework or package install.
[build]
  publish = "."
  command = ""

# Keep the same privacy/security behavior as vercel.json.
# The café has not approved SEO indexing yet.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
