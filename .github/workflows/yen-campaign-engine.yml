name: Yên visual novel campaign engine

on:
  pull_request:
    paths:
      - "tinh-huong/campaign/**"
      - "docs/visual-novel/ENGINE-CONTRACT.md"
      - "tests/yen-campaign-engine.test.mjs"
      - ".github/workflows/yen-campaign-engine.yml"
  push:
    branches: [main]
    paths:
      - "tinh-huong/campaign/**"
      - "docs/visual-novel/ENGINE-CONTRACT.md"
      - "tests/yen-campaign-engine.test.mjs"
      - ".github/workflows/yen-campaign-engine.yml"

permissions:
  contents: read

jobs:
  campaign-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate all days and decision paths
        run: |
          node --test tests/yen-visual-novel-roadmap.test.mjs
          node --test tests/yen-campaign-engine.test.mjs
