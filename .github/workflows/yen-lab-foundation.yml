name: Yên Lab foundation contract
on:
  pull_request:
    paths:
      - docs/yen-lab/**
      - tools/check-yen-lab-foundation.mjs
      - tools/check-yen-lab-catalog.mjs
      - tests/yen-lab-catalog.spec.mjs
      - tools/serve-lab-ux.mjs
      - tests/yen-lab-ux.spec.mjs
      - tests/yen-lab-route.spec.mjs
      - tests/yen-lab-game-kit.spec.mjs
      - tests/yen-lab-engine.test.mjs
      - tests/yen-lab-privacy.spec.mjs
      - tests/yen-lab-smoke.spec.mjs
      - playwright.lab-smoke.config.mjs
      - tools/check-yen-lab-privacy.mjs
      - netlify.toml
      - vercel.json
      - lab/**
      - index.html
      - 404.html
      - playwright.lab-ux.config.mjs
      - package.json
      - package-lock.json
      - .github/codex/game-freeze.test.mjs
      - .github/workflows/game-2d-coding-runner.yml
      - .github/workflows/yen-lab-foundation.yml
  push:
    branches: [main]
    paths:
      - docs/yen-lab/**
      - tools/check-yen-lab-foundation.mjs
      - tools/check-yen-lab-catalog.mjs
      - tests/yen-lab-catalog.spec.mjs
      - tools/serve-lab-ux.mjs
      - tests/yen-lab-ux.spec.mjs
      - tests/yen-lab-route.spec.mjs
      - tests/yen-lab-game-kit.spec.mjs
      - tests/yen-lab-engine.test.mjs
      - tests/yen-lab-privacy.spec.mjs
      - tests/yen-lab-smoke.spec.mjs
      - playwright.lab-smoke.config.mjs
      - tools/check-yen-lab-privacy.mjs
      - netlify.toml
      - vercel.json
      - lab/**
      - index.html
      - 404.html
      - playwright.lab-ux.config.mjs
      - package.json
      - package-lock.json
      - .github/codex/game-freeze.test.mjs
      - .github/workflows/game-2d-coding-runner.yml
      - .github/workflows/yen-lab-foundation.yml
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 15m43s on #209 (8 games); each M4 game adds ~1.5 min. Split or shard the suite before this is reached
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tools/check-yen-lab-foundation.mjs
      - run: node tools/check-yen-lab-catalog.mjs
      - run: node --test .github/codex/game-freeze.test.mjs
      - run: node --test tests/yen-lab-engine.test.mjs
      - run: node tools/check-yen-lab-privacy.mjs
      - run: npm ci
      - name: Locate runner Chrome or install Playwright Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "LAB_UX_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install ffmpeg for failure videos
        run: npx playwright install ffmpeg
      - name: Exercise prototype and /lab/ route (emulated touch and keyboard)
        run: npx playwright test --config playwright.lab-ux.config.mjs
      - name: Lab smoke on the fixture server (5 viewports, links, assets, overlays, game flow)
        run: npx playwright test --config playwright.lab-smoke.config.mjs
      - name: Preserve prototype screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yen-lab-ux-browser-evidence
          path: |
            test-results/lab-ux/
            playwright-report/lab-ux/
            test-results/lab-smoke/
            playwright-report/lab-smoke/
          if-no-files-found: warn
