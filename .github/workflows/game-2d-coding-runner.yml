name: Game 2D coding runner (archived)

# Owner decision 2026-11-19: Phaser development is archived; see #124/#125.
# Deliberately manual-only and credential-free. Restoring development requires
# an explicit owner decision and a reviewed change to this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain archive status
        run: |
          echo 'Game Yên Phaser development is archived. No model, coding, publishing or deployment was started.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Active roadmap: https://github.com/vanphamvn/yen-nghi-choi/issues/124' >> "$GITHUB_STEP_SUMMARY"
