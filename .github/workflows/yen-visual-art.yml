name: Yên painted-art foundation QA

on:
  pull_request:
    paths:
      - "docs/visual-novel/art-manifest.json"
      - "docs/visual-novel/ART-BIBLE.md"
      - "tinh-huong/art-reference/**"
      - "tools/check-yen-visual-art.mjs"
      - "tests/yen-visual-art.test.mjs"
      - "tests/yen-art-reference.spec.mjs"
      - "playwright.yen-art.config.mjs"
      - ".github/workflows/yen-visual-art.yml"
  push:
    branches: [main]
    paths:
      - "docs/visual-novel/art-manifest.json"
      - "docs/visual-novel/ART-BIBLE.md"
      - "tinh-huong/art-reference/**"
      - "tools/check-yen-visual-art.mjs"
      - "tests/yen-visual-art.test.mjs"
      - "tests/yen-art-reference.spec.mjs"
      - "playwright.yen-art.config.mjs"
      - ".github/workflows/yen-visual-art.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node tools/check-yen-visual-art.mjs
      - run: node --test tests/yen-visual-art.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci
      - name: Find system Chrome or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "LAB_UX_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npx playwright test --config playwright.yen-art.config.mjs
      - name: Preserve actual image reference screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yen-art-reference-browser-evidence
          path: |
            playwright-report/yen-art/
            test-results/
          if-no-files-found: warn
