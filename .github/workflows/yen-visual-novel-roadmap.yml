name: Yên visual novel content roadmap

on:
  pull_request:
    paths:
      - "docs/visual-novel/**"
      - "tests/yen-visual-novel-roadmap.test.mjs"
      - "tests/yen-vn-next-work.test.mjs"
      - "tools/vn-next-work.mjs"
      - ".github/workflows/yen-visual-novel-roadmap.yml"
  push:
    branches: [main]
    paths:
      - "docs/visual-novel/**"
      - "tests/yen-visual-novel-roadmap.test.mjs"
      - "tests/yen-vn-next-work.test.mjs"
      - "tools/vn-next-work.mjs"
      - ".github/workflows/yen-visual-novel-roadmap.yml"

permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test tests/yen-visual-novel-roadmap.test.mjs tests/yen-vn-next-work.test.mjs
