name: Game 2D sprite contract
on:
  push:
    paths:
      - "game/preview-2d/**"
      - ".github/workflows/game-2d-contract.yml"
      - "tests/game-2d-background.test.mjs"
      - ".agents/skills/yen-sprite-style/**"
      - ".agents/skills/yen-game-director/**"
      - ".agents/skills/yen-game-release/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - "game/preview-2d/**"
      - ".github/workflows/game-2d-contract.yml"
      - "tests/game-2d-background.test.mjs"
      - ".agents/skills/yen-sprite-style/**"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  sprites-and-routines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Parse game runtime
        run: node --check game/preview-2d/game.js
      - name: Enforce sprite art provenance and style review
        run: node game/preview-2d/tools/audit-art-style.mjs
      - name: Verify sprite atlas, NPC routes, layered scene and art gate
        run: node --test game/preview-2d/tests/game-contract.test.mjs tests/game-2d-background.test.mjs game/preview-2d/tests/art-style-policy.test.mjs
      - name: Validate autonomous game roadmap and selection
        run: |
          node game/preview-2d/tools/next-work.mjs --validate
          node --test game/preview-2d/tests/roadmap.test.mjs
      - name: Verify production release smoke contract
        run: node --test game/preview-2d/tests/production-smoke.test.mjs
      - name: Check sprite SVG XML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob('game/preview-2d/assets/scene/*.svg')
          assert len(paths)>=10, 'missing independent prop textures'
          for path in paths: ET.parse(path)
          print('Validated',len(paths),'SVG textures')
          PY
