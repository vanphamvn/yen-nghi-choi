name: Game 2D sprite contract
on:
  workflow_dispatch:
  push:
    paths:
      - "game/preview-2d/**"
      - ".github/workflows/game-2d-contract.yml"
      - "tests/game-2d*.test.mjs"
      - "game/index.html"
      - "netlify.toml"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".agents/skills/yen-sprite-style/**"
      - ".agents/skills/yen-game-director/**"
      - ".agents/skills/yen-game-release/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - "game/preview-2d/**"
      - ".github/workflows/game-2d-contract.yml"
      - "tests/game-2d*.test.mjs"
      - "game/index.html"
      - "netlify.toml"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - ".agents/skills/yen-sprite-style/**"
      - "AGENTS.md"

concurrency:
  group: game-2d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sprites-and-routines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Parse game runtime
        run: node --check game/preview-2d/game.js
      - name: Enforce sprite art provenance and style review
        run: node game/preview-2d/tools/audit-art-style.mjs
      - name: Verify sprite atlas, NPC routes, layered scene and art gate
        run: node --test game/preview-2d/tests/*.test.mjs tests/game-2d*.test.mjs
      - name: Validate autonomous game roadmap and selection
        run: |
          node game/preview-2d/tools/next-work.mjs --validate
          node --test game/preview-2d/tests/roadmap.test.mjs
      - name: Verify production release smoke contract
        run: node --test game/preview-2d/tests/production-smoke.test.mjs
      - name: Check sprite SVG XML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob('game/preview-2d/assets/scene/*.svg')
          assert len(paths)>=10, 'missing independent prop textures'
          for path in paths: ET.parse(path)
          print('Validated',len(paths),'SVG textures')
          PY

  browser-smoke:
    needs: sprites-and-routines
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  production-content:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [sprites-and-routines, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Wait for linked Netlify deployment and verify every game asset
        run: |
          for attempt in $(seq 1 12); do
            if node game/preview-2d/tools/verify-live.mjs > production-content.json; then
              echo "Production runtime and asset bytes match $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo "https://yencafeday.netlify.app/game/preview-2d/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "Production blocked or stale. See production-content.json. This is not browser or provider SHA verification." >> "$GITHUB_STEP_SUMMARY"
          cat production-content.json
          exit 1
      - name: Smoke-test actual production in three viewports
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          GAME_BASE_URL: https://yencafeday.netlify.app
      - name: Save production browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-production-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Save production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-production-content
          path: production-content.json
          retention-days: 14
