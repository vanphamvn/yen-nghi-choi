name: Yên UI design contract

on:
  pull_request:
    paths:
      - DESIGN.md
      - AGENTS.md
      - .agents/skills/yen-ui-craft/**
      - .claude/skills/yen-ui-craft/**
      - tools/audit-ui-design.mjs
      - .github/workflows/ui-design-contract.yml
  push:
    branches: [main]
    paths:
      - DESIGN.md
      - AGENTS.md
      - .agents/skills/yen-ui-craft/**
      - .claude/skills/yen-ui-craft/**
      - tools/audit-ui-design.mjs
      - .github/workflows/ui-design-contract.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check skill, tokens, references and contrast
        run: node tools/audit-ui-design.mjs
